<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEEF3"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4675A"/>
      <stop offset="1" stop-color="#DC3B31"/>
    </linearGradient>
    <radialGradient id="sun" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FF8A6B"/>
      <stop offset="1" stop-color="#E5453B"/>
    </radialGradient>
    <clipPath id="tile"><rect x="10" y="12" width="108" height="106" rx="26"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1D1D22" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="10" y="12" width="108" height="106" rx="26" fill="url(#page)"/>
    <g clip-path="url(#tile)">
      <rect x="10" y="12" width="108" height="30" fill="url(#band)"/>
      <rect x="10" y="41" width="108" height="1.5" fill="#B82A22" opacity=".25"/>
    </g>
    <rect x="10.5" y="12.5" width="107" height="105" rx="25.5" fill="none" stroke="#1D1D22" stroke-opacity=".08"/>
  </g>
  <!-- binder rings -->
  <rect x="37" y="6" width="7" height="17" rx="3.5" fill="#FFFFFF" stroke="#1D1D22" stroke-opacity=".14"/>
  <rect x="84" y="6" width="7" height="17" rx="3.5" fill="#FFFFFF" stroke="#1D1D22" stroke-opacity=".14"/>
  <!-- the sun's path across the sky, the meridian, and noon -->
  <line x1="64" y1="47" x2="64" y2="101" stroke="#1D1D22" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
  <path d="M27 101 A37 37 0 0 1 101 101" fill="none" stroke="#1D1D22" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
  <line x1="21" y1="101" x2="107" y2="101" stroke="#1D1D22" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="14.5" fill="url(#sun)" stroke="#FFFFFF" stroke-width="4"/>
</svg>
